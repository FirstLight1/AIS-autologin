<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AiS Auto-Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="images/icon48.png" alt="" class="brand-icon">
      <div class="brand-text">
        <h1>AiS Auto-Login</h1>
        <p id="stateLabel" class="state-label">Auto-fill enabled</p>
      </div>
    </div>
    <label class="switch" title="Toggle auto-login">
      <input type="checkbox" class="checkbox" aria-label="Toggle auto-login">
      <span class="slider"></span>
    </label>
  </header>

  <main class="app-body">
    <form id="credentialsForm" novalidate>
      <div class="field">
        <label for="usernameField">Username</label>
        <input type="text" id="usernameField" autocomplete="username" placeholder="xlogin00" required>
      </div>

      <div class="field">
        <label for="passwordField">Password</label>
        <div class="input-with-icon">
          <input type="password" id="passwordField" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" id="togglePassword" class="icon-btn" aria-label="Show password" title="Show password">
            <svg class="eye-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="eye-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.79 19.79 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.86 19.86 0 0 1-4.21 5.19"/>
              <path d="M9.5 9.5a3 3 0 1 0 5 5"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="primary-btn">Save credentials</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <footer class="app-footer">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <span>Encrypted locally — never sent anywhere</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
